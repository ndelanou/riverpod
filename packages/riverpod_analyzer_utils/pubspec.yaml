name: riverpod_analyzer_utils
description: A project for analyzing Riverpod code. This is internally used by riverpod_lint and riverpod_generator
repository: https://github.com/rrousselGit/river_pod
issue_tracker: https://github.com/rrousselGit/riverpod/issues
funding:
  - https://github.com/sponsors/rrousselGit/
version: 0.5.10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  analyzer: ">=8.0.0 <10.0.0"
  collection: ^1.16.0
  crypto: ^3.0.2
  custom_lint_core: ^0.8.1
  freezed_annotation: ^3.0.0
  meta: ^1.7.0
  path: ^1.8.0
  source_span: ^1.8.0

dev_dependencies:
  build: ^4.0.0
  build_runner: ^2.3.2
  build_test: ^3.5.5
  freezed: ^3.0.2
  lints: ^2.0.0
  test: ^1.21.7
